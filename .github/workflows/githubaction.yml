name: mydonet project

on: 
  push:
    branches:
      - develop

jobs:
  dotnet_publish:
    runs-on: 'ubuntu-latest'

    steps:
      - name: code checkout
        uses: actions/checkout@v5
      - name: sonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v6
        with:
         mysonar: ${{secrets.SONAR_TOKEN }}
         mysonarurl: ${{secrets.SONAR_HOST_URL}}

      - name: install dotnet
        uses: actions/setup-dotnet@v4
        with:
        dotnet_version: "9.0.100"
      - name: Checkout code
        uses: actions/checkout@v5

      - name: this is my dotnet publish command
        run: dotnet publish -c Release src/Presentation/Nop.Web/Nop.Web.csproj -o pillakattupula sravanthi